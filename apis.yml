name: LearnSprout
description: LearnSprout was a San Francisco edtech company founded in 2012 by Franklyn Chien, Anthony
  Wu and Joe Woo out of the Imagine K12 accelerator. It built LearnSprout Connect, an API layer that
  unlocked K-12 student data held in student information systems (SIS) through direct database
  integration rather than the SIS application layer, giving edtech developers a single "once and done"
  integration plus a change-log endpoint for incremental syncs. It also sold a district-facing analytics
  product covering attendance, grades and college readiness, reaching over 2,500 schools across 42
  states on roughly $4.7M raised from Andreessen Horowitz, Formation 8 and Samsung Ventures. Apple
  acquired the company in January 2016 and the public API was retired; learnsprout.com no longer
  resolves and is parked on Apple nameservers.
